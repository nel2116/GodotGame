version: "3.8"

services:
    godot-dev:
        build: .
        container_name: godot-game-dev
        volumes:
            - .:/workspace
            - godot-config:/root/.config/godot
            - cursor-config:/root/.config/Cursor
            - obsidian-config:/root/.config/obsidian
        ports:
            - "6006:6006" # Godot Editor
            - "3000:3000" # Cursor IDE
            - "8080:8080" # Godot Export
        environment:
            - DISPLAY=host.docker.internal:0.0
            - XAUTHORITY=/root/.Xauthority
            - GODOT_EDITOR_PATH=/usr/local/bin/godot
            - CURSOR_PATH=/usr/local/bin/cursor
            - OBSIDIAN_PATH=/usr/bin/obsidian
        networks:
            - godot-network
        restart: unless-stopped
        stdin_open: true
        tty: true

volumes:
    godot-config:
    cursor-config:
    obsidian-config:

networks:
    godot-network:
        driver: bridge
